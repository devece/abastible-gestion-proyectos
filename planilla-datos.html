.btn-sec{background:none;border:1px solid var(--accent);color:var(--accent);border-radius:8px;padding:9px 12px}

/* ================= FORMATO RUT ================= */

function formatearRUT(rut) {

  rut = rut.replace(/[^0-9kK]/g, '').toUpperCase();

  if (rut.length < 2) return rut;

  let cuerpo = rut.slice(0, -1);
  let dv = rut.slice(-1);

  cuerpo = cuerpo.replace(/\B(?=(\d{3})+(?!\d))/g, ".");

  return cuerpo + "-" + dv;
}

document.querySelectorAll(".rut").forEach(input => {

  input.addEventListener("input", function () {
    this.value = formatearRUT(this.value);
  });

});
/* ================= FORMATO TELÉFONO CHILE ================= */

function formatearTelefono(valor){

  let numeros = valor.replace(/\D/g, '');

  // quitar 56 si lo repiten
  if(numeros.startsWith("56")) numeros = numeros.slice(2);

  // máximo 9 dígitos nacionales
  numeros = numeros.slice(0,9);

  let resultado = "+56 ";

  if(numeros.length > 0){
    resultado += numeros[0] + " ";
  }

  if(numeros.length > 1){
    resultado += numeros.slice(1,5);
  }

  if(numeros.length > 5){
    resultado += " " + numeros.slice(5,9);
  }

  return resultado.trim();
}

document.querySelectorAll(".telefono").forEach(input => {

  input.addEventListener("input", function(){
    this.value = formatearTelefono(this.value);
  });

});

    com_correo_facturacion:v('com_correo_facturacion'), com_fecha_fundacion:v('com_fecha_fundacion'),
    com_tamano_empresa:v('com_tamano_empresa'), com_estacionalidad:v('com_estacionalidad'),
    com_contacto_nombre:v('com_contacto_nombre'), com_contacto_telefono:v('com_contacto_telefono'), com_contacto_correo:v('com_contacto_correo')
  };

  var btn=document.getElementById('btnGuardar');
  btn.disabled=true; btn.textContent='Guardando...';

  try{
    var existente=await sb.from('proyectos').select('id,item').eq('codigo',codigo).limit(1);
    if(existente.error) throw existente.error;

    if(existente.data && existente.data.length){
      var upd=await sb.from('proyectos').update(payload).eq('id',existente.data[0].id);
      if(upd.error) throw upd.error;
      mostrarBanner('✅ Proyecto '+codigo+' actualizado en la Planilla Maestra (ya existía).','ok');
    } else {
      var maxRes=await sb.from('proyectos').select('item').order('item',{ascending:false}).limit(1);
      if(maxRes.error) throw maxRes.error;
      var nextItem=(maxRes.data&&maxRes.data.length?maxRes.data[0].item:0)+1;
      var cliente=payload.hab_nombre_cliente||payload.const_razon_social||payload.com_razon_social||'';
      var nuevo=Object.assign({},payload,{
        item:nextItem, cliente:cliente, tipo:'00 Sin Tipo de proyecto asignado',
        status:'2. Entregado a coordinador', etapa:'Validación',
        f_v_coord:new Date().toISOString()
      });
      var ins=await sb.from('proyectos').insert(nuevo);
      if(ins.error) throw ins.error;
      mostrarBanner('✅ Proyecto '+codigo+' creado en la Planilla Maestra.','ok');
    }
    generarPDF();
  }catch(e){
    console.error('Error guardando en Supabase', e);
    mostrarBanner('⚠️ No se pudo guardar en la Planilla Maestra: '+(e.message||e),'err');
  }finally{
    btn.disabled=false; btn.textContent='Guardar en Planilla Maestra + PDF';
  }
}
</script></body>
</html>
